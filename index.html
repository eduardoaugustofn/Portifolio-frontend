<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eduardo Augusto | Portfólio</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --accent: #33ff66;
      --accent-soft: #1f9e45;
      --bg: #050b0f;
      --text: #d9f9e8;
      --error: #ff6a6a;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      line-height: 1.6;
    }

    #terminal {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
    }

    .linha { margin: 2px 0; white-space: pre-wrap; word-break: break-word; }
    .destaque { color: var(--accent); font-weight: bold; }
    .dim { color: var(--accent-soft); }
    .muted { color: #7fa895; }
    .erro { color: var(--error); }

    a { color: var(--accent); }

    .bloco {
      margin: 10px 0 14px;
      padding-left: 8px;
      border-left: 2px solid var(--accent-soft);
    }

    .projeto { margin: 10px 0; }

    .atalhos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    button {
      background: transparent;
      border: 1px solid var(--accent-soft);
      color: var(--text);
      font: inherit;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover, button:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    input[type="color"] {
      width: 48px;
      height: 32px;
      border: 1px solid var(--accent-soft);
      background: transparent;
      padding: 0;
      vertical-align: middle;
    }

    .tela-cobrinha {
      display: block;
      width: 100%;
      max-width: 480px;
      height: auto;
      margin: 10px 0 8px;
      border: 1px solid var(--accent-soft);
      border-radius: 12px;
      background: #07141a;
      box-shadow: 0 0 22px rgba(51, 255, 102, 0.08);
    }

    .controles {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }

    .controles button {
      width: 56px;
      height: 48px;
      font-size: 20px;
      padding: 0;
    }

    .controles .espaco { width: 56px; }

    form { display: flex; align-items: center; margin-top: 10px; }

    .prompt {
      white-space: nowrap;
      color: var(--accent);
      font-weight: bold;
      padding-right: 6px;
    }

    #entrada {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      padding: 6px 0;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 1em;
      background: var(--accent);
      animation: piscar 1s steps(1) infinite;
      vertical-align: text-bottom;
    }

    @keyframes piscar { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="terminal">
    <div class="linha dim">Portfólio de Eduardo Augusto Freitas Nogueira</div>
    <div class="linha dim">Digite <span class="destaque">ajuda</span> para ver os comandos.</div>

    <div class="atalhos" aria-label="Atalhos">
      <button data-cmd="sobre">sobre</button>
      <button data-cmd="projetos">projetos</button>
      <button data-cmd="experiencias">experiencias</button>
      <button data-cmd="certificados">certificados</button>
      <button data-cmd="contato">contato</button>
      <button data-cmd="aparencia">aparencia</button>
      <button data-cmd="cobrinha">cobrinha</button>
    </div>

    <div id="saida"></div>

    <form id="formulario" autocomplete="off">
      <span class="prompt">eduardo@portfolio:~$</span>
      <input id="entrada" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      <span class="cursor" aria-hidden="true"></span>
    </form>
  </div>

  <script>
    const DADOS = {
      sobre: {
        pt: [
          "Nome: Eduardo Augusto Freitas Nogueira",
          "Formação: estudante de Ciência da Computação na PUC Minas, em Belo Horizonte, no primeiro período.",
          "Interesses: desenvolvimento web, front-end, jogos e interfaces acessíveis.",
          "Objetivo: tornar-se Full Stack Developer até 2030 e conseguir um estágio na área até 2028."
        ],
        en: [
          "Name: Eduardo Augusto Freitas Nogueira",
          "Education: Computer Science student at PUC Minas, Belo Horizonte, in the first semester.",
          "Interests: web development, front-end, games and accessible interfaces.",
          "Goal: become a Full Stack Developer by 2030 and secure a development internship by 2028."
        ]
      },
      projetos: [
        {
          nome: "Heróis da Saúde",
          ano: 2026,
          descricao: "Jogo educativo sobre saúde, desenvolvido como projeto interdisciplinar entre Computação e Medicina na PUC Minas.",
          tecnologias: [],
          repositorio: "",
          imagem: ""
        }
      ],
      experiencias: [],
      certificados: [
        { nome: "Inglês C1", instituicao: "Wimbledon School of English", ano: 2024 }
      ],
      contato: {
        email: "eduafn2008@gmail.com",
        github: "https://github.com/eduardoaugustofn",
        linkedin: "https://br.linkedin.com/in/eduardo-augusto-freitas-nogueira-948112350"
      }
    };

    const CORES = {
      verde: "#33ff66",
      ambar: "#ffb86c",
      azul: "#6cb8ff",
      roxo: "#c49cff",
      vermelho: "#ff6a6a",
      branco: "#e6e6e6"
    };
    const COR_PADRAO = "#33ff66";
    const CHAVE_COR = "portfolio-cor";

    const COBRINHA = { largura: 24, altura: 14, celula: 20, intervalo: 150 };
    let jogo = null;

    const saida = document.getElementById("saida");
    const formulario = document.getElementById("formulario");
    const entrada = document.getElementById("entrada");
    const terminal = document.getElementById("terminal");

    function rolar() {
      terminal.scrollTop = terminal.scrollHeight;
    }

    function linha(texto, classe) {
      const div = document.createElement("div");
      div.className = "linha " + (classe || "");
      div.textContent = texto;
      saida.appendChild(div);
      rolar();
      return div;
    }

    function bloco() {
      const div = document.createElement("div");
      div.className = "bloco";
      saida.appendChild(div);
      return div;
    }

    function textoLinha(t) {
      const div = document.createElement("div");
      div.className = "linha";
      div.textContent = t;
      return div;
    }

    function textoDestaque(t) {
      const div = document.createElement("div");
      div.className = "linha destaque";
      div.textContent = t;
      return div;
    }

    function ligacao(url, texto) {
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = texto || url;
      return a;
    }

    function linhaComLink(rotulo, url, texto) {
      const div = document.createElement("div");
      div.className = "linha";
      div.textContent = rotulo;
      div.appendChild(ligacao(url, texto));
      return div;
    }

    function aplicarCor(cor) {
      document.documentElement.style.setProperty("--accent", cor);
      document.documentElement.style.setProperty("--accent-soft", cor);
    }

    function salvarCor(cor) {
      try {
        localStorage.setItem(CHAVE_COR, cor);
      } catch (e) {
        // navegador bloqueou o armazenamento; a cor vale só nesta sessão
      }
    }

    function carregarCor() {
      try {
        return localStorage.getItem(CHAVE_COR);
      } catch (e) {
        return null;
      }
    }

    function escolherCor(cor) {
      aplicarCor(cor);
      salvarCor(cor);
      linha("Cor alterada para " + cor + ".", "destaque");
    }

    /* ---------- Jogo da cobrinha ---------- */

    function corAtual() {
      return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || COR_PADRAO;
    }

    function retangulo(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function novaComida(estado) {
      let p;
      do {
        p = {
          x: Math.floor(Math.random() * COBRINHA.largura),
          y: Math.floor(Math.random() * COBRINHA.altura)
        };
      } while (estado.cobra.some((s) => s.x === p.x && s.y === p.y));
      return p;
    }

    function desenharCobrinha() {
      const e = jogo;
      if (!e) return;
      const ctx = e.ctx;
      const c = COBRINHA.celula;
      const cor = corAtual();

      ctx.clearRect(0, 0, e.canvas.width, e.canvas.height);

      // grade sutil
      ctx.fillStyle = "rgba(255, 255, 255, 0.035)";
      for (let x = 0; x < COBRINHA.largura; x++) {
        for (let y = 0; y < COBRINHA.altura; y++) {
          ctx.beginPath();
          ctx.arc(x * c + c / 2, y * c + c / 2, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // comida com brilho
      const comidaX = e.comida.x * c + c / 2;
      const comidaY = e.comida.y * c + c / 2;
      ctx.save();
      ctx.shadowColor = "#ffb86c";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#ffb86c";
      ctx.beginPath();
      ctx.arc(comidaX, comidaY, c * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // corpo: da cauda até a cabeça, escurecendo em direção à cauda
      const total = e.cobra.length;
      for (let i = total - 1; i >= 0; i--) {
        const s = e.cobra[i];
        const proporcao = total > 1 ? i / (total - 1) : 0;
        ctx.save();
        ctx.globalAlpha = i === 0 ? 1 : 0.35 + 0.65 * (1 - proporcao);
        ctx.shadowColor = cor;
        ctx.shadowBlur = i === 0 ? 12 : 4;
        ctx.fillStyle = cor;
        retangulo(ctx, s.x * c + 2, s.y * c + 2, c - 4, c - 4, i === 0 ? 7 : 5);
        ctx.fill();
        ctx.restore();
      }

      // olhos da cabeça na direção do movimento
      const cabeca = e.cobra[0];
      const cx = cabeca.x * c + c / 2;
      const cy = cabeca.y * c + c / 2;
      const d = e.dir;
      const perpX = -d.y;
      const perpY = d.x;
      ctx.fillStyle = "#050b0f";
      [-1, 1].forEach((lado) => {
        const ox = d.x * 3 + perpX * 3.5 * lado;
        const oy = d.y * 3 + perpY * 3.5 * lado;
        ctx.beginPath();
        ctx.arc(cx + ox, cy + oy, 1.9, 0, Math.PI * 2);
        ctx.fill();
      });

      e.placar.textContent = "Pontos: " + e.pontos;
    }

    function encerrarCobrinha() {
      if (jogo && jogo.timer) clearInterval(jogo.timer);
      if (jogo) jogo.ativo = false;
    }

    function fimDeJogo() {
      const e = jogo;
      encerrarCobrinha();
      const ctx = e.ctx;
      ctx.fillStyle = "rgba(5, 11, 15, 0.7)";
      ctx.fillRect(0, 0, e.canvas.width, e.canvas.height);
      ctx.fillStyle = corAtual();
      ctx.font = "bold 22px Courier New, monospace";
      ctx.textAlign = "center";
      ctx.fillText("Fim de jogo", e.canvas.width / 2, e.canvas.height / 2 - 6);
      ctx.font = "16px Courier New, monospace";
      ctx.fillText("Pontos: " + e.pontos, e.canvas.width / 2, e.canvas.height / 2 + 20);
      e.placar.textContent = "Digite cobrinha para jogar de novo.";
      e.placar.className = "linha destaque";
      rolar();
    }

    function passoCobrinha() {
      const e = jogo;
      if (!e || !e.ativo) return;
      e.dir = e.proxDir;
      const cabeca = e.cobra[0];
      const nova = { x: cabeca.x + e.dir.x, y: cabeca.y + e.dir.y };

      const bateuParede =
        nova.x < 0 || nova.y < 0 || nova.x >= COBRINHA.largura || nova.y >= COBRINHA.altura;
      const bateuNoCorpo = e.cobra.some((s) => s.x === nova.x && s.y === nova.y);
      if (bateuParede || bateuNoCorpo) {
        fimDeJogo();
        return;
      }

      e.cobra.unshift(nova);
      if (nova.x === e.comida.x && nova.y === e.comida.y) {
        e.pontos++;
        e.comida = novaComida(e);
      } else {
        e.cobra.pop();
      }
      desenharCobrinha();
    }

    function mudarDirecao(dx, dy) {
      if (!jogo || !jogo.ativo) return;
      if (dx === -jogo.dir.x && dy === -jogo.dir.y) return;
      jogo.proxDir = { x: dx, y: dy };
    }

    function iniciarCobrinha() {
      encerrarCobrinha();

      const b = bloco();
      b.appendChild(textoDestaque("Cobrinha"));
      b.appendChild(textoLinha("Use as setas do teclado ou os botões. Digite sair para parar."));

      const canvas = document.createElement("canvas");
      canvas.className = "tela-cobrinha";
      canvas.width = COBRINHA.largura * COBRINHA.celula;
      canvas.height = COBRINHA.altura * COBRINHA.celula;
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", "Tabuleiro do jogo da cobrinha");
      b.appendChild(canvas);

      const placar = textoLinha("");
      b.appendChild(placar);

      const controles = document.createElement("div");
      controles.className = "controles";
      const botoes = [
        ["↑", 0, -1],
        ["←", -1, 0],
        ["→", 1, 0],
        ["↓", 0, 1]
      ];
      const linhaSuperior = document.createElement("div");
      linhaSuperior.className = "controles";
      linhaSuperior.style.margin = "0";
      const espaco = document.createElement("span");
      espaco.className = "espaco";
      linhaSuperior.appendChild(espaco);
      const cima = criarBotaoSeta(botoes[0]);
      linhaSuperior.appendChild(cima);
      b.appendChild(linhaSuperior);

      const linhaInferior = document.createElement("div");
      linhaInferior.className = "controles";
      linhaInferior.style.margin = "0";
      linhaInferior.appendChild(criarBotaoSeta(botoes[1]));
      linhaInferior.appendChild(criarBotaoSeta(botoes[3]));
      linhaInferior.appendChild(criarBotaoSeta(botoes[2]));
      b.appendChild(linhaInferior);

      const inicio = {
        x: Math.floor(COBRINHA.largura / 2),
        y: Math.floor(COBRINHA.altura / 2)
      };
      const estado = {
        cobra: [inicio, { x: inicio.x - 1, y: inicio.y }, { x: inicio.x - 2, y: inicio.y }],
        dir: { x: 1, y: 0 },
        proxDir: { x: 1, y: 0 },
        pontos: 0,
        comida: null,
        ativo: true,
        timer: null,
        canvas: canvas,
        ctx: canvas.getContext("2d"),
        placar: placar
      };
      estado.comida = novaComida(estado);
      jogo = estado;
      desenharCobrinha();
      estado.timer = setInterval(passoCobrinha, COBRINHA.intervalo);
      rolar();
    }

    function criarBotaoSeta([rotulo, dx, dy]) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = rotulo;
      btn.setAttribute("aria-label", "Mover");
      btn.addEventListener("click", () => mudarDirecao(dx, dy));
      return btn;
    }

    document.addEventListener("keydown", (evento) => {
      if (!jogo || !jogo.ativo) return;
      const direcoes = {
        ArrowUp: [0, -1],
        ArrowDown: [0, 1],
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0]
      };
      const d = direcoes[evento.key];
      if (d) {
        evento.preventDefault();
        mudarDirecao(d[0], d[1]);
      }
    });

    /* ---------- Comandos ---------- */

    const comandos = {
      ajuda() {
        linha("Comandos disponíveis:", "destaque");
        linha("  sobre          apresentação (PT e EN)");
        linha("  projetos       projetos");
        linha("  experiencias   experiências");
        linha("  certificados   certificações");
        linha("  contato        formas de contato");
        linha("  aparencia      trocar a cor do terminal");
        linha("  cobrinha       jogo da cobrinha");
        linha("  sair           para o jogo da cobrinha");
        linha("  limpar         limpa a tela");
      },

      sobre() {
        const b = bloco();
        const pt = document.createElement("div");
        pt.className = "linha destaque";
        pt.textContent = "[PT]";
        b.appendChild(pt);
        DADOS.sobre.pt.forEach((t) => b.appendChild(textoLinha(t)));

        const en = document.createElement("div");
        en.className = "linha destaque";
        en.textContent = "[EN]";
        b.appendChild(en);
        DADOS.sobre.en.forEach((t) => b.appendChild(textoLinha(t)));
        rolar();
      },

      projetos() {
        const b = bloco();
        b.appendChild(textoDestaque("Projetos (do mais antigo ao mais recente)"));

        DADOS.projetos.forEach((p) => {
          const item = document.createElement("div");
          item.className = "projeto";
          item.appendChild(textoDestaque(p.ano + " | " + p.nome));
          item.appendChild(textoLinha(p.descricao));
          if (p.tecnologias.length) {
            item.appendChild(textoLinha("Tecnologias: " + p.tecnologias.join(", ")));
          }
          if (p.repositorio) {
            item.appendChild(linhaComLink("Repositório: ", p.repositorio, "GitHub"));
          }
          if (p.imagem) {
            const img = document.createElement("img");
            img.src = p.imagem;
            img.alt = "Imagem do projeto " + p.nome;
            img.style.maxWidth = "100%";
            item.appendChild(img);
          }
          b.appendChild(item);
        });
        rolar();
      },

      experiencias() {
        if (DADOS.experiencias.length === 0) {
          linha("Em breve.", "muted");
          return;
        }
        const b = bloco();
        DADOS.experiencias.forEach((e) => {
          b.appendChild(textoDestaque(e.cargo + " | " + e.empresa));
          b.appendChild(textoLinha(e.periodo));
          b.appendChild(textoLinha(e.descricao));
        });
        rolar();
      },

      certificados() {
        const b = bloco();
        DADOS.certificados.forEach((c) => {
          b.appendChild(textoDestaque(c.nome + " (" + c.ano + ")"));
          b.appendChild(textoLinha(c.instituicao));
        });
        rolar();
      },

      contato() {
        const b = bloco();
        const email = document.createElement("div");
        email.className = "linha";
        email.textContent = "E-mail: ";
        email.appendChild(ligacao("mailto:" + DADOS.contato.email, DADOS.contato.email));
        b.appendChild(email);
        b.appendChild(linhaComLink("GitHub: ", DADOS.contato.github, "github.com/eduardoaugustofn"));
        b.appendChild(linhaComLink("LinkedIn: ", DADOS.contato.linkedin, "linkedin.com/in/eduardo-augusto-freitas-nogueira"));
        rolar();
      },

      aparencia(args) {
        const escolha = (args || "").trim().toLowerCase();

        if (escolha === "padrao" || escolha === "padrão") {
          escolherCor(COR_PADRAO);
          return;
        }
        if (CORES[escolha]) {
          escolherCor(CORES[escolha]);
          return;
        }
        if (/^#[0-9a-f]{6}$/.test(escolha)) {
          escolherCor(escolha);
          return;
        }

        const b = bloco();
        b.appendChild(textoDestaque("Aparência: escolha uma cor"));
        const botoes = document.createElement("div");
        botoes.className = "atalhos";
        Object.keys(CORES).forEach((nome) => {
          const btn = document.createElement("button");
          btn.textContent = nome;
          btn.addEventListener("click", () => escolherCor(CORES[nome]));
          botoes.appendChild(btn);
        });
        const reset = document.createElement("button");
        reset.textContent = "restaurar padrão";
        reset.addEventListener("click", () => escolherCor(COR_PADRAO));
        botoes.appendChild(reset);
        b.appendChild(botoes);

        const linhaPersonalizada = document.createElement("div");
        linhaPersonalizada.className = "linha";
        linhaPersonalizada.textContent = "Cor personalizada: ";
        const seletor = document.createElement("input");
        seletor.type = "color";
        seletor.value = COR_PADRAO;
        seletor.addEventListener("input", (evento) => escolherCor(evento.target.value));
        linhaPersonalizada.appendChild(seletor);
        b.appendChild(linhaPersonalizada);

        linha("Ou digite: aparencia azul | aparencia #ff00aa | aparencia padrao", "muted");
        rolar();
      },

      cobrinha() {
        iniciarCobrinha();
      },

      sair() {
        if (jogo && jogo.ativo) {
          encerrarCobrinha();
          linha("Jogo encerrado. Pontos: " + jogo.pontos + ".", "destaque");
        } else {
          linha("Nenhum jogo em andamento.", "muted");
        }
      },

      limpar() {
        encerrarCobrinha();
        saida.innerHTML = "";
      }
    };

    function executar(texto) {
      const entradaLimpa = texto.trim();
      linha("eduardo@portfolio:~$ " + entradaLimpa, "muted");
      if (!entradaLimpa) return;

      const partes = entradaLimpa.toLowerCase().split(/\s+/);
      const cmd = partes[0];
      const args = entradaLimpa.split(/\s+/).slice(1).join(" ");

      if (cmd === "ajuda") {
        comandos.ajuda();
        return;
      }
      if (cmd === "aparencia" || cmd === "aparência") {
        comandos.aparencia(args);
        return;
      }
      if (!comandos[cmd]) {
        linha("Comando não encontrado: " + cmd + ". Digite \"ajuda\".", "erro");
        return;
      }
      comandos[cmd]();
    }

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();
      const texto = entrada.value;
      entrada.value = "";
      executar(texto);
      entrada.focus();
    });

    document.querySelectorAll("[data-cmd]").forEach((btn) => {
      btn.addEventListener("click", () => {
        executar(btn.dataset.cmd);
        entrada.focus();
      });
    });

    terminal.addEventListener("click", (evento) => {
      if (evento.target.closest("button, a, input, canvas")) return;
      entrada.focus();
    });

    const corSalva = carregarCor();
    if (corSalva) aplicarCor(corSalva);

    linha("Digite \"ajuda\" para ver os comandos.", "dim");
  </script>
</body>
