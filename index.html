<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eduardo Augusto | Portfólio</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #050b0f;
      --bg-panel: #09171b;
      --bg-panel-2: #0f1f26;
      --text: #d9f9e8;
      --muted: #7adbb1;
      --accent: #7af0c6;
      --accent-2: #a0f6cb;
      --line: rgba(122, 240, 198, 0.28);
      --warning: #ffb86c;
      --error: #ff6a6a;
      --shadow: 0 0 18px rgba(122, 240, 198, 0.15);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      line-height: 1.6;
    }

    body {
      background-image:
        radial-gradient(circle at top, rgba(122, 240, 198, 0.08), transparent 30%),
        linear-gradient(180deg, #050b0f 0%, #09171b 100%);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover, a:focus-visible {
      text-decoration: underline;
    }

    img {
      max-width: 100%;
      display: block;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-top: 10px;
    }

    .container {
      width: min(1100px, calc(100% - 24px));
      margin: 0 auto;
    }

    .term-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(5, 11, 15, 0.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(6px);
    }

    .term-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 8px 0;
    }

    .brand {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .mini-nav {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      font: inherit;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .nav-btn:focus-visible {
      background: rgba(122, 240, 198, 0.08);
      border-color: rgba(122, 240, 198, 0.5);
      outline: none;
    }

    .terminal {
      padding: 20px 0 40px;
      min-height: calc(100vh - 58px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .line {
      margin: 4px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .dim { color: #86d1ae; }
    .muted { color: var(--muted); }
    .highlight { color: var(--accent-2); font-weight: bold; }
    .error { color: var(--error); }
    .warning { color: var(--warning); }

    .output {
      margin-top: 10px;
    }

    .block {
      margin: 14px 0 18px;
      padding-left: 8px;
      border-left: 2px solid var(--line);
    }

    .cmdline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 4px;
      width: 100%;
    }

    .prompt {
      white-space: nowrap;
      color: var(--accent);
      font-weight: 700;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
    }

    #input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      outline: none;
      padding: 6px 0;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.05em;
      background: var(--accent);
      animation: blink 1s steps(1) infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .card {
      margin-top: 8px;
      padding: 12px 0;
    }

    .card h3 {
      margin: 0 0 8px;
      color: var(--accent-2);
    }

    .project-list, .experience-list, .contact-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .project-item, .experience-item {
      margin: 10px 0 14px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .project-item:first-child, .experience-item:first-child {
      border-top: none;
      padding-top: 0;
    }

    .project-meta, .period {
      color: var(--muted);
      margin-bottom: 6px;
      font-size: 0.95em;
    }

    .contact-list li {
      margin-bottom: 8px;
    }

    @media (max-width: 640px) {
      .term-header-inner {
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 0 12px;
      }

      .mini-nav {
        width: 100%;
      }

      .nav-btn {
        flex: 1 1 48%;
        text-align: center;
      }

      .cmdline {
        align-items: flex-start;
      }

      .prompt {
        padding-top: 4px;
      }
    }
  </style>
</head>
<body>
  <header class="term-header">
    <div class="container term-header-inner">
      <div class="brand">eduardo@portfolio:~$</div>
      <nav class="mini-nav" aria-label="Comandos rápidos">
        <button class="nav-btn" data-cmd="sobre">sobre</button>
        <button class="nav-btn" data-cmd="projetos">projetos</button>
        <button class="nav-btn" data-cmd="experiencias">experiencias</button>
        <button class="nav-btn" data-cmd="contato">contato</button>
      </nav>
    </div>
  </header>

  <main class="terminal" id="terminal">
    <div class="container">
      <div class="line dim">Portfólio de Eduardo Augusto Freitas Nogueira</div>
      <div class="line dim">Digite <span class="highlight">ajuda</span> para ver os comandos.</div>
      <div id="output" class="output"></div>

      <form id="cli" class="cmdline" autocomplete="off">
        <label for="input" class="prompt">eduardo@portfolio:~$</label>
        <div class="input-wrap">
          <input id="input" type="text" name="input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" autofocus>
          <span class="cursor" aria-hidden="true"></span>
        </div>
      </form>
    </div>
  </main>

  <script>
    const saida = document.getElementById('output');
    const form = document.getElementById('cli');
    const input = document.getElementById('input');
    const terminal = document.getElementById('terminal');

    const dados = {
      pt: {
        nome: 'Eduardo Augusto Freitas Nogueira',
        formacao: 'Formação em Ciência da Computação na PUC Minas.',
        atuacao: 'Atuação em desenvolvimento web Front-end, interfaces responsivas, acessibilidade e experiência do usuário.',
        interesses: 'Interesses em Front-end, UX/UI, desenvolvimento de interfaces, produtos digitais e soluções acessíveis.',
        objetivo: 'Objetivo profissional: evoluir como desenvolvedor front-end e contribuir em projetos com impacto real.',
        experiencia: [
          { empresa: 'PUC Minas', cargo: 'Estudante / Atividades acadêmicas', periodo: '202x — atual', descricao: 'Participação em projetos acadêmicos e atividades relacionadas a tecnologia, desenvolvimento web e ciência da computação.' },
          { empresa: 'Projetos pessoais', cargo: 'Desenvolvimento de interfaces e protótipos', periodo: '202x — atual', descricao: 'Criação de páginas e interfaces voltadas para usabilidade, responsividade e apresentação visual clara.' }
        ],
        projetos: [
          { nome: 'Portfólio pessoal', ano: '202x', descricao: 'Site pessoal com foco em apresentação profissional e comunicação visual clara.', tecnologias: ['HTML', 'CSS', 'JavaScript'], repo: 'https://github.com/eduardoaugustofn/Portifolio-frontend', imagem: 'https://via.placeholder.com/800x420?text=Portfolio' },
          { nome: 'Projeto web acadêmico', ano: '202x', descricao: 'Aplicação ou protótipo desenvolvido em contexto acadêmico para exercícios e testes de interface e front-end.', tecnologias: ['HTML', 'CSS', 'JavaScript'], repo: 'https://github.com/eduardoaugustofn', imagem: 'https://via.placeholder.com/800x420?text=Projeto+Academico' }
        ],
        contato: {
          email: 'eduardo@example.com',
          github: 'https://github.com/eduardoaugustofn',
          linkedin: 'https://www.linkedin.com/in/eduardoaugustofn'
        }
      },
      en: {
        nome: 'Eduardo Augusto Freitas Nogueira',
        formacao: 'Computer Science student at PUC Minas.',
        atuacao: 'Focused on front-end development, responsive interfaces, accessibility and user experience.',
        interesses: 'Interests include front-end, UX/UI, web interfaces, digital products and accessible solutions.',
        objetivo: 'Professional goal: grow as a front-end developer and contribute to projects with real impact.',
        experiencia: [
          { empresa: 'PUC Minas', cargo: 'Student / Academic activities', periodo: '202x — current', descricao: 'Participation in academic projects and activities related to technology, web development and computer science.' },
          { empresa: 'Personal projects', cargo: 'Interface and prototype development', periodo: '202x — current', descricao: 'Creating pages and interfaces focused on usability, responsiveness and clear visual communication.' }
        ],
        projetos: [
          { nome: 'Personal portfolio', ano: '202x', descricao: 'Personal website focused on professional presentation and clear visual communication.', tecnologias: ['HTML', 'CSS', 'JavaScript'], repo: 'https://github.com/eduardoaugustofn/Portifolio-frontend', imagem: 'https://via.placeholder.com/800x420?text=Portfolio' },
          { nome: 'Academic web project', ano: '202x', descricao: 'Application or prototype developed in an academic setting for front-end and interface testing.', tecnologias: ['HTML', 'CSS', 'JavaScript'], repo: 'https://github.com/eduardoaugustofn', imagem: 'https://via.placeholder.com/800x420?text=Academic+Project' }
        ],
        contato: {
          email: 'eduardo@example.com',
          github: 'https://github.com/eduardoaugustofn',
          linkedin: 'https://www.linkedin.com/in/eduardoaugustofn'
        }
      }
    };

    function appendLine(text, classe = '') {
      const div = document.createElement('div');
      div.className = 'line ' + classe;
      div.textContent = text;
      saida.appendChild(div);
      rolar();
      return div;
    }

    function appendBlock(content) {
      const div = document.createElement('div');
      div.className = 'block';
      div.appendChild(content);
      saida.appendChild(div);
      rolar();
      return div;
    }

    function link(url, text = url) {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = text;
      return a;
    }

    function createLabel(text, className = '') {
      const el = document.createElement('div');
      el.className = 'line ' + className;
      el.textContent = text;
      return el;
    }

    function rolar() {
      terminal.scrollTop = terminal.scrollHeight;
    }

    function renderSobre() {
      const bloco = document.createElement('div');
      bloco.className = 'block';

      const pt = document.createElement('div');
      pt.className = 'line highlight';
      pt.textContent = '[PT]';
      bloco.appendChild(pt);

      bloco.appendChild(createLabel('Nome: ' + dados.pt.nome));
      bloco.appendChild(createLabel('Formação: ' + dados.pt.formacao));
      bloco.appendChild(createLabel('Atuação: ' + dados.pt.atuacao));
      bloco.appendChild(createLabel('Interesses: ' + dados.pt.interesses));
      bloco.appendChild(createLabel('Objetivo: ' + dados.pt.objetivo));

      const en = document.createElement('div');
      en.className = 'line highlight';
      en.textContent = '[EN]';
      bloco.appendChild(en);

      bloco.appendChild(createLabel('Name: ' + dados.en.nome));
      bloco.appendChild(createLabel('Education: ' + dados.en.formacao));
      bloco.appendChild(createLabel('Focus: ' + dados.en.atuacao));
      bloco.appendChild(createLabel('Interests: ' + dados.en.interesses));
      bloco.appendChild(createLabel('Goal: ' + dados.en.objetivo));

      saida.appendChild(bloco);
      rolar();
    }

    function renderProjetos() {
      const bloco = document.createElement('div');
      bloco.className = 'block';

      const titulo = document.createElement('div');
      titulo.className = 'line highlight';
      titulo.textContent = 'Projetos';
      bloco.appendChild(titulo);

      const list = document.createElement('ul');
      list.className = 'project-list';

      dados.pt.projetos.forEach((projeto) => {
        const item = document.createElement('li');
        item.className = 'project-item';

        const nome = document.createElement('div');
        nome.className = 'line highlight';
        nome.textContent = projeto.nome + ' (' + projeto.ano + ')';
        item.appendChild(nome);

        const descricao = document.createElement('div');
        descricao.className = 'line';
        descricao.textContent = projeto.descricao;
        item.appendChild(descricao);

        const tech = document.createElement('div');
        tech.className = 'line muted';
        tech.textContent = 'Tecnologias: ' + projeto.tecnologias.join(', ');
        item.appendChild(tech);

        const repo = document.createElement('div');
        repo.className = 'line';
        repo.appendChild(document.createTextNode('Repositório: '));
        repo.appendChild(link(projeto.repo, 'GitHub'));
        item.appendChild(repo);

        if (projeto.imagem) {
          const img = document.createElement('img');
          img.src = projeto.imagem;
          img.alt = 'Imagem do projeto ' + projeto.nome;
          item.appendChild(img);
        }

        list.appendChild(item);
      });

      bloco.appendChild(list);
      saida.appendChild(bloco);
      rolar();
    }

    function renderExperiencias() {
      const bloco = document.createElement('div');
      bloco.className = 'block';

      const titulo = document.createElement('div');
      titulo.className = 'line highlight';
      titulo.textContent = 'Experiencias';
      bloco.appendChild(titulo);

      const list = document.createElement('ul');
      list.className = 'experience-list';

      dados.pt.experiencia.forEach((itemData) => {
        const item = document.createElement('li');
        item.className = 'experience-item';

        const nome = document.createElement('div');
        nome.className = 'line highlight';
        nome.textContent = itemData.empresa + ' — ' + itemData.cargo;
        item.appendChild(nome);

        const periodo = document.createElement('div');
        periodo.className = 'line period';
        periodo.textContent = itemData.periodo;
        item.appendChild(periodo);

        const desc = document.createElement('div');
        desc.className = 'line';
        desc.textContent = itemData.descricao;
        item.appendChild(desc);

        list.appendChild(item);
      });

      bloco.appendChild(list);
      saida.appendChild(bloco);
      rolar();
    }

    function renderContato() {
      const bloco = document.createElement('div');
      bloco.className = 'block';

      const titulo = document.createElement('div');
      titulo.className = 'line highlight';
      titulo.textContent = 'Contato';
      bloco.appendChild(titulo);

      const list = document.createElement('ul');
      list.className = 'contact-list';

      const email = document.createElement('li');
      email.textContent = 'E-mail: ';
      email.appendChild(link('mailto:' + dados.pt.contato.email, dados.pt.contato.email));
      list.appendChild(email);

      const github = document.createElement('li');
      github.textContent = 'GitHub: ';
      github.appendChild(link(dados.pt.contato.github, 'github.com/eduardoaugustofn'));
      list.appendChild(github);

      const linkedin = document.createElement('li');
      linkedin.textContent = 'LinkedIn: ';
      linkedin.appendChild(link(dados.pt.contato.linkedin, 'linkedin.com/in/eduardoaugustofn'));
      list.appendChild(linkedin);

      bloco.appendChild(list);
      saida.appendChild(bloco);
      rolar();
    }

    const comandos = {
      ajuda() {
        appendLine('Comandos disponíveis:', 'highlight');
        appendLine('  sobre          apresentação');
        appendLine('  projetos       lista de projetos');
        appendLine('  experiencias   experiências');
        appendLine('  contato        contato');
        appendLine('  limpar         limpa a tela');
      },

      sobre() {
        renderSobre();
      },

      projetos() {
        renderProjetos();
      },

      experiencias() {
        renderExperiencias();
      },

      contato() {
        renderContato();
      },

      limpar() {
        saida.innerHTML = '';
      }
    };

    function executar(texto) {
      const cmd = texto.trim().toLowerCase();
      appendLine('eduardo@portfolio:~$ ' + texto, 'muted');

      if (!cmd) return;

      if (!comandos[cmd]) {
        appendLine('Comando não encontrado: ' + cmd + '. Digite "ajuda".', 'error');
        return;
      }

      comandos[cmd]();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      executar(input.value);
      input.value = '';
      input.focus();
    });

    document.querySelectorAll('.nav-btn').forEach((button) => {
      button.addEventListener('click', () => {
        const cmd = button.dataset.cmd;
        executar(cmd);
        input.focus();
      });
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Tab') {
        event.preventDefault();
        const sugestões = ['ajuda', 'sobre', 'projetos', 'experiencias', 'contato', 'limpar'];
        const atual = input.value.trim().toLowerCase();
        const encontrada = sugestões.find((cmd) => cmd.startsWith(atual));
        if (encontrada) {
          input.value = encontrada;
        }
      }
    });

    terminal.addEventListener('click', () => input.focus());
    appendLine('Digite "ajuda" para ver os comandos.', 'dim');
  </script>
</body>
</html>
